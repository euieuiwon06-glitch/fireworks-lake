<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>불꽃 호수</title>
<style>
  html, body { margin: 0; height: 100%; background: #101738; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas {
    display: block;
    width: min(100vw, calc(100dvh * 0.8));
    height: auto;
    aspect-ratio: 280 / 350;
    image-rendering: pixelated;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
</style>
</head>
<body>
<canvas id="c" width="280" height="350" aria-label="산과 호수 위로 클릭하면 폭죽이 피어오르는 픽셀 그림"></canvas>
<script src="main.js?v=20261124p"></script>
</body>
</html>
